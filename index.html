<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DJ VamLykTan</title>
  <meta name="description" content="Offizielle Homepage von DJ VamLykTan">
  <link rel="stylesheet" href="counter.css">

  <style>
    #rotate-device {
      display: none;
    }

    @media (max-width: 900px) and (orientation: portrait) and (pointer: coarse) {
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #030005;
      }

      #viewport,
      #debug-panel {
        display: none !important;
      }

      #rotate-device {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        box-sizing: border-box;
        padding: 24px;
        overflow: hidden;
        color: #f4e7ff;
        text-align: center;
        background:
          radial-gradient(circle at 50% 32%, rgba(218, 63, 255, .23), transparent 35%),
          radial-gradient(circle at 18% 78%, rgba(135, 0, 255, .16), transparent 34%),
          linear-gradient(180deg, #100014 0%, #050008 55%, #010102 100%);
      }

      #rotate-device::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: .62;
        background:
          repeating-linear-gradient(
            180deg,
            rgba(239, 94, 255, .035) 0,
            rgba(239, 94, 255, .035) 2px,
            transparent 2px,
            transparent 8px
          ),
          linear-gradient(90deg, transparent, rgba(217, 83, 255, .08), transparent);
      }

      .rotate-card {
        position: relative;
        width: min(82vw, 380px);
        box-sizing: border-box;
        padding: 34px 24px 30px;
        border: 1px solid rgba(224, 91, 255, .68);
        background: rgba(12, 0, 17, .82);
        box-shadow:
          inset 0 0 22px rgba(216, 73, 255, .12),
          0 0 30px rgba(202, 39, 255, .24),
          0 0 70px rgba(141, 0, 255, .10);
      }

      .rotate-phone {
        position: relative;
        width: 58px;
        height: 96px;
        margin: 0 auto 30px;
        border: 2px solid #e26cff;
        border-radius: 10px;
        box-shadow:
          inset 0 0 14px rgba(226, 108, 255, .14),
          0 0 18px rgba(226, 108, 255, .32);
        transform: rotate(90deg);
      }

      .rotate-phone::before {
        content: "";
        position: absolute;
        left: 50%;
        bottom: 6px;
        width: 7px;
        height: 7px;
        border: 1px solid #e26cff;
        border-radius: 50%;
        transform: translateX(-50%);
        box-shadow: 0 0 8px rgba(226, 108, 255, .65);
      }

      .rotate-phone::after {
        content: "↻";
        position: absolute;
        left: 50%;
        top: 50%;
        color: #f19cff;
        font-size: 34px;
        line-height: 1;
        text-shadow: 0 0 14px rgba(226, 108, 255, .70);
        transform: translate(-50%, -50%) rotate(-90deg);
      }

      .rotate-title {
        margin: 0;
        color: #ed83ff;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(28px, 8vw, 42px);
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: .12em;
        text-transform: uppercase;
        text-shadow:
          0 0 10px rgba(236, 104, 255, .48),
          0 0 24px rgba(184, 42, 255, .24);
      }

      .rotate-line {
        width: 128px;
        height: 1px;
        margin: 20px auto 18px;
        background: linear-gradient(90deg, transparent, #e26cff, transparent);
        box-shadow: 0 0 12px rgba(226, 108, 255, .70);
      }

      .rotate-text {
        margin: 0;
        color: rgba(244, 231, 255, .82);
        font-family: Georgia, "Times New Roman", serif;
        font-size: 13px;
        line-height: 1.65;
        letter-spacing: .14em;
        text-transform: uppercase;
      }
    }
  </style>

  <script src="debug-auth.js"></script>
  <script src="counter.js" defer></script>
  <script src="gothic-enter.js" defer></script>
  <script src="counter-live.js" defer></script>
  <script src="ios-note.js" defer></script>
</head>
<body>
  <div id="rotate-device" role="status" aria-live="polite">
    <div class="rotate-card">
      <div class="rotate-phone" aria-hidden="true"></div>
      <h1 class="rotate-title">GERÄT DREHEN</h1>
      <div class="rotate-line" aria-hidden="true"></div>
      <p class="rotate-text">Diese Seite ist auf dem Handy nur im Landscape-Modus verfügbar.</p>
    </div>
  </div>

  <main id="viewport" aria-label="DJ VamLykTan">
    <div id="stage">
      <img id="hero-image" class="hero-image"
           src="images/Gothic.png"
           alt="DJ VamLykTan Hero">

      <img id="soul-overlay" class="soul-overlay"
           src="images/Gothic_Soul.png"
           alt=""
           aria-hidden="true">

      <aside id="soul-readout" aria-label="Seelen und Echos">
        <section class="counter counter-souls" aria-label="Seelen">
          <span class="counter-label">SEELEN</span>
          <strong id="souls" class="counter-value soul-value">000</strong>
        </section>

        <div class="counter-divider" aria-hidden="true">
          <span class="divider-diamond"></span>
        </div>

        <section class="counter counter-echoes" aria-label="Echos">
          <span class="counter-label">ECHOS</span>
          <strong id="echoes" class="counter-value echo-value">000</strong>
        </section>
      </aside>
    </div>
  </main>

  <form id="debug-panel" autocomplete="off" hidden>
    <label>Bild
      <select id="debug-hero">
        <option value="gothic">Gothic</option>
        <option value="main">mainbackground</option>
        <option value="psycho">Psycho</option>
      </select>
    </label>

    <label>Seelen
      <input id="debug-souls" type="number" min="0" step="1">
    </label>

    <label>Echos
      <input id="debug-echoes" type="number" min="0" step="1">
    </label>

    <button type="submit">Setzen</button>
  </form>
</body>
</html>
