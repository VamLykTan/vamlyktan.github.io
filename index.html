<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>DJ VamLykTan</title>

    <meta name="description"
          content="Offizielle Homepage von DJ VamLykTan">

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
    <script src="gothic-enter.js" defer></script>
</head>


<body>
<a
    href="projects/"
    class="background-button projects-button"
    aria-label="Projekte">
</a>  

    <header class="site-header">

        <div class="logo">
            DJ VamLykTan
        </div>

        <nav class="main-nav">
            <a href="#home">Home</a>
            <a href="#aktuell">Aktuell</a>
            <a href="#termine">Termine</a>
            <a href="#kontakt">Kontakt</a>
        </nav>

    </header>


    <main>

        <section id="home" class="hero">

            <div class="hero-overlay"></div>

            <div class="hero-content">

                <h1>DJ VamLykTan</h1>

                <p class="hero-claim">
                    Darkness has a frequency.
                </p>

                <div class="hero-buttons">

                    <a href="#aktuell"
                       class="button button-primary">
                        Aktuell
                    </a>

                    <a href="#kontakt"
                       class="button button-secondary">
                        Kontakt
                    </a>

                </div>

            </div>

        </section>


        <section id="aktuell" class="content-section">

            <h2>Aktuell</h2>

            <p>
                Hier entstehen aktuelle Informationen,
                Veranstaltungen und Neuigkeiten.
            </p>

        </section>


        <section id="termine" class="content-section">

            <h2>Termine</h2>

            <p>
                Kommende Termine folgen.
            </p>

        </section>


        <section id="kontakt" class="content-section">

            <h2>Kontakt</h2>

            <p>
                Social Media und Kontaktmöglichkeiten folgen.
            </p>

        </section>

    </main>


    <footer class="site-footer">

        <p>
            © DJ VamLykTan
        </p>

    </footer>

</body>
</html>
