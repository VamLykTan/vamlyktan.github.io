<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DJ VamLykTan</title>
  <meta name="description" content="Offizielle Homepage von DJ VamLykTan">
  <link rel="stylesheet" href="counter.css">
  <script src="counter.js" defer></script>
  <script src="counter-live.js" defer></script>
</head>
<body>
  <main id="viewport" aria-label="DJ VamLykTan">
    <div id="stage">
      <img id="hero-image" class="hero-image"
           src="images/Gothic.png"
           alt="DJ VamLykTan Hero">

      <img id="soul-overlay" class="soul-overlay"
           src="images/Gothic_Soul.png"
           alt=""
           aria-hidden="true">

      <aside id="soul-readout" aria-label="Seelen und Echos">
        <section class="counter counter-souls" aria-label="Seelen">
          <span class="counter-label">SEELEN</span>
          <strong id="souls" class="counter-value soul-value">000</strong>
        </section>

        <div class="counter-divider" aria-hidden="true">
          <span class="divider-diamond"></span>
        </div>

        <section class="counter counter-echoes" aria-label="Echos">
          <span class="counter-label">ECHOS</span>
          <strong id="echoes" class="counter-value echo-value">000</strong>
        </section>
      </aside>
    </div>
  </main>

  <form id="debug-panel" autocomplete="off" hidden>
    <label>Bild
      <select id="debug-hero">
        <option value="gothic">Gothic</option>
        <option value="main">mainbackground</option>
        <option value="psycho">Psycho</option>
      </select>
    </label>

    <label>Seelen
      <input id="debug-souls" type="number" min="0" step="1">
    </label>

    <label>Echos
      <input id="debug-echoes" type="number" min="0" step="1">
    </label>

    <button type="submit">Setzen</button>
  </form>
</body>
</html>
